<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>canvasLoading Demo</title>
    <link rel="stylesheet" href="/demo/style.css" />
  </head>
  <body>
    <main class="layout">
      <section class="canvas-panel">
        <canvas id="canvas_loading" width="256" height="256"></canvas>
      </section>
      <section class="control-panel">
        <h1>canvasLoading</h1>
        <form id="controls">
          <label>
            テキスト
            <input type="text" name="text" />
          </label>
          <label>
            フォントサイズ
            <input type="range" name="fontsize" min="8" max="96" step="1" />
            <output data-output="fontsize"></output>
          </label>
          <label class="checkbox">
            <input type="checkbox" name="bold" /> 太字
          </label>
          <label>
            回転体の数
            <input type="range" name="circleNumber" min="1" max="64" step="1" />
            <output data-output="circleNumber"></output>
          </label>
          <label>
            回転速度
            <input type="range" name="speed" min="-255" max="255" step="1" />
            <output data-output="speed"></output>
          </label>
          <label>
            半径 (%)
            <input type="range" name="radius" min="0.5" max="10" step="0.1" />
            <output data-output="radius"></output>
          </label>
          <label>
            長さ (%)
            <input type="range" name="length" min="0" max="100" step="1" />
            <output data-output="length"></output>
          </label>
          <label>
            軌道サイズ (%)
            <input type="range" name="orbitRadiusRate" min="10" max="200" step="1" />
            <output data-output="orbitRadiusRate"></output>
          </label>
          <label>
            テキストカラー
            <input type="color" name="textColor" />
          </label>
          <label>
            色1
            <input type="color" name="color1" />
          </label>
          <label>
            色2
            <input type="color" name="color2" />
          </label>
          <label class="checkbox">
            <input type="checkbox" name="hasStroke" /> 枠線を描画
          </label>
          <label>
            枠線カラー
            <input type="color" name="strokeColor" />
          </label>
        </form>
      </section>
    </main>
    <script type="module" src="/demo/main.js"></script>
  </body>
</html>
